","line.mh_animals.look":"They keep walking toward the mountain.","line.mh.follow":"Where are you going?","ui.chapter3_end":"End of Chapter 3","room.mountain_trail":"The Trail","actor.raven":"Raven","obj.find_trail":"Find the animals' trail.","line.tr.arrive1":"The path splits.","line.tr.arrive2":"Someone's up on the rocks... watching me.","hs.tr_raven":"Man on the rocks","line.tr_raven.look":"A man in black, with a gun. He hasn't moved.","dlg.raven.1":"You're a long way from the village, boy.","dlg.raven.2":"I'm following the animals.","dlg.raven.3":"Animals go where they want.","dlg.raven.4":"Who are you?","dlg.raven.5":"Someone who would turn around, if he were you.","dlg.raven.6":"Are you one of the Ravens?","dlg.raven.7":"Go home, boy. Before it gets dark.","dlg.raven.again":"Still here?","hs.tr_wool":"Wool","line.tr_wool.look":"Wool on the thorns, on the right. She went this way.","hs.tr_hoofprints":"Hoofprints","line.tr_hoofprints.look":"Fresh hoofprints, going to the right.","hs.tr_hills":"Hills","line.tr_hills.look":"Hills and rocks, as far as I can see.","hs.tr_left":"Left path","line.tr_left.look":"A path to the left, toward a dark forest.","hs.tr_right":"Back down","line.tr_right.look":"The way I came, back down the mountain.","line.tr.fork2":"Another fork. I need to look at the ground.","line.tr.fork3":"That bleat... it came from the right.","line.tr.forest1":"A forest... It's so dark in there.","line.tr.forest2":"I'm not going in there.","dlg.raven.forest":"Not that way, boy. Nobody goes into those trees.","dlg.raven.scared":"Scared of the trees, boy?","line.tr.tickets1":"Something on the ground... plane tickets.","line.tr.tickets2":`This one is half burnt, but it's stamped. "Professor..." The name is burnt away.`,"line.tr.tickets3":'The other one was paid for, but never stamped. "Sal Emeel Hamzeh."',"item.flight_tickets":"Plane tickets","item.flight_tickets.look":'Two plane tickets. One half burnt and stamped: "Professor..." the name is burnt away. Th
